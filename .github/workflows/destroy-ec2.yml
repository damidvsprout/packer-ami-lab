
name: Destroy Packer AMI EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy-ec2:
    name: Terminate EC2 and Delete Security Group
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Find and terminate lab EC2 instances
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=Packer-AMI-Terraform-EC2" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No matching EC2 instances found."
          else
            echo "Instances to terminate: $INSTANCE_IDS"

            aws ec2 terminate-instances \
              --instance-ids $INSTANCE_IDS

            for INSTANCE_ID in $INSTANCE_IDS; do
              aws ec2 wait instance-terminated \
                --instance-ids "$INSTANCE_ID"
            done

            echo "EC2 instances terminated successfully."
          fi

      - name: Delete lab security group
        shell: bash
        run: |
          set -euo pipefail

          SG_IDS=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=packer-ami-terraform-web-sg" \
            --query 'SecurityGroups[].GroupId' \
            --output text)

          if [ -z "$SG_IDS" ] || [ "$SG_IDS" = "None" ]; then
            echo "Security group not found. Nothing to delete."
          else
            for SG_ID in $SG_IDS; do
              echo "Deleting security group: $SG_ID"
              aws ec2 delete-security-group \
                --group-id "$SG_ID"
            done
          fi
