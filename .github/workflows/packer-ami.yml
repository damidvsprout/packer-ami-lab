
name: Build Linux AMI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ami:
    name: Build Packer AMI
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify Packer template exists
      - name: Check Packer template
        run: |
          pwd
          ls -la
          test -f packer.pkr.hcl

      # Step 3: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 4: Verify AWS authentication
      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # Step 5: Install Packer
      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.14.2"

       - name: Initialize Packer
        working-directory: ${{ github.workspace }}
        run: packer init packer.pkr.hcl

      - name: Validate Packer template
        working-directory: ${{ github.workspace }}
        run: packer validate packer.pkr.hcl

      - name: Build Linux AMI
        working-directory: ${{ github.workspace }}
        run: packer build packer.pkr.hcl
