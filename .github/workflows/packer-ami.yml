
name: Build Linux AMI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-ami:
    name: Build Packer AMI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner time
        run: date -u

      - name: Debug GitHub OIDC claims
        shell: bash
        env:
          OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set +x
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import base64

          url = os.environ["OIDC_REQUEST_URL"]
          request_token = os.environ["OIDC_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url = url + separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + request_token}
          )

          with urllib.request.urlopen(request) as response:
              token = json.loads(response.read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "iss", "aud", "sub", "repository", "ref", "environment"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::449355864501:role/GitHubPackerRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Initialize Packer
        run: packer init .

      - name: Validate Packer template
        run: packer validate .

      - name: Build Linux AMI
        run: packer build .
