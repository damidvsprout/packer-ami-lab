
name: Build Linux AMI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ami:
    name: Build Packer AMI
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify repository and Packer template
      - name: Check Packer template
        shell: bash
        run: |
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Repository files:"
          ls -la "$GITHUB_WORKSPACE"

          if [ ! -f "$GITHUB_WORKSPACE/packer.pkr.hcl" ]; then
            echo "ERROR: packer.pkr.hcl not found in repository root"
            exit 1
          fi

          echo "Packer template found successfully."

      # Step 3: Configure AWS credentials using GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 4: Verify AWS authentication
      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # Step 5: Install Packer
      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.14.2"

      # Step 6: Initialize Packer plugins
      - name: Initialize Packer
        working-directory: ${{ github.workspace }}
        run: packer init packer.pkr.hcl

      # Step 7: Validate Packer template
      - name: Validate Packer template
        working-directory: ${{ github.workspace }}
        run: packer validate packer.pkr.hcl

      # Step 8: Build the AMI
      - name: Build Linux AMI
        working-directory: ${{ github.workspace }}
        run: packer build packer.pkr.hcl
